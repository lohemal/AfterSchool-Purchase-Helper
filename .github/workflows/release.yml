name: 릴리스 만들기

# 버전 태그를 올리면 설치 파일을 만들어 릴리스에 올린다.
#
#   npm run version:set 0.2.0
#   git add . && git commit -m "v0.2.0"
#   git tag v0.2.0 && git push origin main --tags
#
# 손으로 돌리려면 Actions 탭에서 [Run workflow] 를 눌러도 된다.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # 이 프로그램은 Windows 전용이다 (한글 COM · Windows 내장 글자 인식)
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Node 준비
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Rust 준비
        uses: dtolnay/rust-toolchain@stable

      - name: Rust 빌드 캐시
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 의존성 설치
        run: npm ci

      # 여기서 막히면 릴리스가 만들어지지 않는다.
      - name: 버전이 세 곳에서 같은지
        run: npm run check:version

      - name: 타입 검사 · 화면 빌드
        run: npm run build

      - name: 계산 규칙 검사
        run: npm run check:model

      # 실제 업무 샘플은 저장소에 없다. 그 시험들은 스스로 건너뛴다.
      - name: 서버 시험
        run: cargo test --lib
        working-directory: src-tauri

      - name: 설치 파일 만들기 · 서명
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri build

      # 앱 이름이 한글이라 만들어진 파일 이름도 한글이다. GitHub 릴리스는 첨부
      # 파일 이름에서 한글을 떼어 내므로 영문 이름으로 복사하고 latest.json 도
      # 그 이름을 가리키게 한다. PowerShell 은 한글을 깨뜨린 적이 있어 Node 로 만든다.
      - name: 파일 이름 정리 · latest.json 만들기
        run: node scripts/make-release.mjs $(echo "${{ github.ref_name }}" | sed 's/^v//') ${{ github.repository }}
        shell: bash

      # 올리기 전에 서명이 앱의 공개 키와 짝인지 실제로 검증한다
      - name: 서명·파일명·버전 검증
        run: npm run check:release

      - name: 릴리스 올리기
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $ver = $tag.TrimStart('v')
          $notes = @"
          ## 설치 방법

          아래 ``afterschool-purchase-helper_${ver}_x64-setup.exe`` 를 내려받아 실행하세요.
          관리자 권한이 필요 없습니다.

          > Windows 가 "PC를 보호했습니다" 창을 띄우면 **추가 정보 → 실행** 을 누르세요.
          > 코드 서명 인증서가 없는 프로그램은 모두 이렇게 나옵니다.

          이미 쓰고 계신 분은 프로그램을 켜면 새 버전 알림이 뜹니다.

          ## 자료는 그대로 남습니다

          자료는 프로그램과 따로 ``%APPDATA%\kr.school.afterschool-purchase-helper`` 에 있습니다.
          업데이트해도, 프로그램을 지웠다 다시 깔아도 그대로입니다.

          ## 첨부 파일

          | 파일 | 무엇인가요 |
          |---|---|
          | ``afterschool-purchase-helper_….exe`` | 설치 파일. 이것만 받으면 됩니다 |
          | ``afterschool-purchase-helper_….exe.sig`` | 서명. 프로그램이 업데이트할 때 확인합니다 |
          | ``latest.json`` | 업데이트 정보. 프로그램이 읽습니다 |
          | ``SHA256SUMS.txt`` | 내려받은 파일이 온전한지 확인용 |
          "@

          # 같은 태그로 다시 돌릴 때를 대비해, 있으면 지우고 새로 만든다
          gh release delete $tag --yes 2>$null
          gh release create $tag (Get-ChildItem release | ForEach-Object { $_.FullName }) `
            --title "방과후 품의 도우미 $tag" --notes $notes
